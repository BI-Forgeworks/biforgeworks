[package]
name = "biforgeworks-powerbi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only Power BI Project (PBIP) discovery and format identification for BI Forgeworks."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Descriptor-relative, no-follow, no-atime reads (openat/fstatat/O_NOATIME)
# are not expressible with std alone.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
